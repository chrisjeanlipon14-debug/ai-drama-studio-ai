
<!doctype html>
<html lang="tl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111827">
  <title>AI Drama Studio</title>
  <style>
    :root {
      --bg: #0b1020;
      --panel: #141b2e;
      --text: #f5f7ff;
      --muted: #aab4cc;
      --line: #303b58;
      --accent: #ff8a3d;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.5 system-ui, sans-serif;
    }

    header {
      padding: 20px 16px;
      background: #0c1222;
      border-bottom: 1px solid var(--line);
    }

    .wrap, main {
      max-width: 900px;
      margin: auto;
    }

    .brand {
      font-size: 22px;
      font-weight: 900;
      color: var(--accent);
    }

    .muted { color: var(--muted); font-size: 13px; }

    main { padding: 22px 14px 40px; }

    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 15px;
      padding: 18px;
      margin-bottom: 16px;
    }

    h1 { font-size: clamp(26px, 5vw, 36px); }
    h2 { font-size: 19px; margin-top: 0; }

    label {
      display: block;
      margin: 14px 0 7px;
      font-size: 13px;
      font-weight: 800;
    }

    textarea, select {
      width: 100%;
      padding: 12px;
      background: #0b1120;
      border: 1px solid var(--line);
      border-radius: 10px;
      color: var(--text);
      font: inherit;
    }

    textarea {
      min-height: 130px;
      resize: vertical;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }

    .lengths {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    button {
      cursor: pointer;
      font: inherit;
    }

    .length-btn, .secondary {
      background: #0b1120;
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 9px;
      padding: 9px 13px;
    }

    .length-btn.selected {
      border-color: var(--accent);
      background: #422817;
    }

    #send-button {
      width: 100%;
      padding: 14px;
      margin-top: 18px;
      border: 0;
      border-radius: 10px;
      background: var(--accent);
      color: #211207;
      font-weight: 900;
    }

    button:disabled { opacity: .6; cursor: wait; }

    #status {
      margin-top: 12px;
      padding: 10px;
      border-radius: 8px;
      background: #0b1120;
      color: var(--muted);
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-size: 13px;
    }

    #status.error { color: #ffbaba; }
    #status.ok { color: #a9f4c5; }

    #result { display: none; }

    #output {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      background: #0b1120;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 14px;
      font: 14px/1.7 system-ui, sans-serif;
    }

    .actions { display: flex; gap: 8px; flex-wrap: wrap; }

    footer {
      text-align: center;
      padding: 20px;
      color: var(--muted);
      font-size: 12px;
    }

    @media (max-width: 620px) {
      .grid { grid-template-columns: 1fr; }
      .card { padding: 14px; }
    }
  </style>
</head>

<body>
<header>
  <div class="wrap">
    <div class="brand">🎬 AI Drama Studio</div>
    <div class="muted">Tagalog Horror • Drama • Short Videos</div>
  </div>
</header>

<main>
  <h1>Gawing kuwento ang ideya mo.</h1>
  <p class="muted">Bumuo ng drama plan bago gumawa ng video.</p>

  <section class="card">
    <h2>💡 Drama Idea</h2>
    <p class="muted">Ilarawan ang kuwentong gusto mong gawin.</p>

    <label for="user-input">Ideya ng kuwento</label>
    <textarea id="user-input"
      placeholder="Halimbawa: Isang babae ang nakaririnig ng katok sa aparador tuwing alas-dose ng gabi..."></textarea>

    <div class="grid">
      <div>
        <label for="language">Wika</label>
        <select id="language">
          <option value="Tagalog">Tagalog</option>
          <option value="English">English</option>
          <option value="Taglish">Taglish</option>
        </select>
      </div>

      <div>
        <label for="genre">Genre</label>
        <select id="genre">
          <option>Horror</option>
          <option>Drama</option>
          <option>Comedy</option>
          <option>Romance</option>
          <option>Mystery</option>
          <option>Thriller</option>
          <option>Family drama</option>
        </select>
      </div>

      <div>
        <label for="style">Visual Style</label>
        <select id="style">
          <option>Cinematic realistic</option>
          <option>3D cartoon</option>
          <option>Stylized animation</option>
          <option>Anime-inspired</option>
        </select>
      </div>
    </div>

    <label>Haba ng video plan</label>
    <div class="lengths" id="length-options">
      <button type="button" class="length-btn" data-minutes="1">1 min</button>
      <button type="button" class="length-btn" data-minutes="3">3 min</button>
      <button type="button" class="length-btn selected" data-minutes="5">5 min</button>
      <button type="button" class="length-btn" data-minutes="10">10 min</button>
    </div>

    <button id="send-button" type="button">
      🎬 Create Drama Plan
    </button>

    <div id="status" role="status" aria-live="polite">
      Handa na. Ilagay ang ideya mo.
    </div>
  </section>

  <section id="result" class="card">
    <h2>📜 Drama Plan</h2>
    <div class="actions">
      <button id="copy-button" class="secondary" type="button">Kopyahin</button>
      <button id="download-button" class="secondary" type="button">I-download</button>
    </div>
    <pre id="output"></pre>
  </section>
</main>

<footer>AI Drama Studio • Original Drama Planning</footer>

<script src="/chat.js?v=20261016-1" defer></script>
</body>
</html>
